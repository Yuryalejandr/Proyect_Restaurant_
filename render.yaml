services:
  - type: web
    name: zeloura-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    healthCheckPath: /
    disk:
      name: zeloura-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DB_PATH
        value: /var/data/restaurante.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "false"